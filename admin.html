<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Face Recognition System</title>
  <link rel="stylesheet" href="admin.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" />
</head>
<body>
  <div id="admin-content">
    <div class="container-fluid">
      <div class="row">
        <div class="col-md-3 col-lg-2 sidebar p-0">
          <div class="d-flex flex-column p-3">
            <a href="#" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-white text-decoration-none">
              <span class="fs-4">Admin Panel</span>
            </a>
            <hr />
            <ul class="nav nav-pills flex-column mb-auto">
              <li class="nav-item">
                <a href="#" class="nav-link active" id="dashboard-tab">
                  <i class="bi bi-speedometer2 me-2"></i>
                  Dashboard
                </a>
              </li>
              <li>
                <a href="#" class="nav-link" id="access-logs-tab">
                  <i class="bi bi-clock-history me-2"></i>
                  Registros de Acceso
                </a>
              </li>
              <li>
                <a href="#" class="nav-link" id="users-tab">
                  <i class="bi bi-people me-2"></i>
                  Usuarios Registrados
                </a>
              </li>
            </ul>
            <hr />
            <div class="dropdown">
              <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
                <img src="https://github.com/mdo.png" alt="Admin" width="32" height="32" class="rounded-circle me-2" />
                <strong>Admin</strong>
              </a>
              <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
                <li><a class="dropdown-item" href="#" id="logout-btn">Cerrar sesión</a></li>
              </ul>
            </div>
          </div>
        </div>

        <div class="col-md-9 col-lg-10 main-content ms-sm-auto px-md-4 py-4">
          <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
            <h1 class="h2" id="page-title">Dashboard</h1>
          </div>

          <div class="row mb-4" id="dashboard-cards">
            <div class="col-md-4">
              <div class="card bg-primary text-white p-3">
                <div class="card-body">
                  <h5 class="card-title">Total Usuarios</h5>
                  <h2 class="card-text" id="total-users">0</h2>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card bg-success text-white p-3">
                <div class="card-body">
                  <h5 class="card-title">Accesos Hoy</h5>
                  <h2 class="card-text" id="today-access">0</h2>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card bg-info text-white p-3">
                <div class="card-body">
                  <h5 class="card-title">Último Acceso</h5>
                  <h4 class="card-text" id="last-access">Ninguno</h4>
                </div>
              </div>
            </div>
          </div>

          <div class="table-responsive d-none" id="logs-container">
            <table class="table table-striped" id="logsTable">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Usuario</th>
                  <th>Fecha y Hora de Acceso</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>

          <div class="card mb-4 d-none" id="users-content">
            <div class="card-header">
              <h5 class="card-title mb-0">Usuarios Registrados</h5>
            </div>
            <div class="card-body">
              <div class="table-responsive">
                <table id="users-table" class="table table-striped" style="width:100%">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Nombre</th>
                      <th>Usuario</th>
                      <th>Acciones</th>
                    </tr>
                  </thead>
                  <tbody></tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal fade" id="userModal" tabindex="-1" aria-labelledby="userModalLabel" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="userModalLabel">Detalles del Usuario</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3"><label class="form-label">Nombre:</label><p id="modal-user-name"></p></div>
            <div class="mb-3"><label class="form-label">Username:</label><p id="modal-user-username"></p></div>
            <div class="mb-3"><label class="form-label">Último acceso:</label><p id="modal-user-lastaccess"></p></div>
            <div class="mb-3"><label class="form-label">Total accesos:</label><p id="modal-user-totalaccess"></p></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="admin.js"></script>
</body>
</html>
